spring.application.name=meongnyang_Jiphapso
# JSP 설정
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Oracle 설정
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=jdbc:log4jdbc:oracle:thin:@192.168.10.107:1521/xe
spring.datasource.username=scott
spring.datasource.password=tiger

# MyBatis 설정
#mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=classpath:mybatis/mapper/**.xml

# spring.servlet.multipart.enabled = true 다중파일여부 기본값
# 최대 파일 크기 설정 (기본값 : 1MB)
spring.servlet.multipart.max-file-size = 30MB
# 최대 요청 크기 설정 (기본값 : 1MB)
spring.servlet.multipart.max-request-size = 300MB

spring.elasticsearch.uris=http://192.168.10.107:9200


