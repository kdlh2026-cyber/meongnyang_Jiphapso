portone.channel-key.naverpay=${PORTONE_CHANNEL_NAVERPAY}
portone.channel-key.payco=${PORTONE_CHANNEL_PAYCO:}
portone.channel-key.smilepay=${PORTONE_CHANNEL_SMILEPAY:}

# 챗봇 연동
